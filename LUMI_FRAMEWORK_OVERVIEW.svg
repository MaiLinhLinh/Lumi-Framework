<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1480" viewBox="0 0 2000 1480" role="img" aria-labelledby="title desc">
  <title id="title">Lumi Multi-Agent Framework — Object Flow</title>
  <desc id="desc">Sơ đồ đối tượng mô tả Main Agent, Task Manager Agent, từng task con, các service mà task gọi, Artifact Store, Complete Surface Task, Registry và Extension Points.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcfdff"/><stop offset="1" stop-color="#f2f7fb"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#263d59" flood-opacity="0.12"/></filter>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3b70ad"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d77b31"/></marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7759b3"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#269369"/></marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #17283f; }
      .title { font-size: 34px; font-weight: 750; }.subtitle { font-size: 17px; fill: #5b7087; }
      .group-title { font-size: 20px; font-weight: 750; }.box-title { font-size: 18px; font-weight: 750; }
      .body { font-size: 14px; fill: #425a72; }.small { font-size: 13px; fill: #5a7087; }.tiny { font-size: 12px; fill: #64798f; }
      .pill { font-size: 12px; font-weight: 750; letter-spacing: .35px; }
      .flow { fill: none; stroke: #3b70ad; stroke-width: 2.6; marker-end: url(#blueArrow); }
      .fallback { fill: none; stroke: #d77b31; stroke-width: 2.3; stroke-dasharray: 8 6; marker-end: url(#orangeArrow); }
      .catalog { fill: none; stroke: #7759b3; stroke-width: 2.3; stroke-dasharray: 8 6; marker-end: url(#purpleArrow); }
      .register { fill: none; stroke: #269369; stroke-width: 2.6; marker-end: url(#greenArrow); }
    </style>
  </defs>

  <rect width="2000" height="1480" fill="url(#bg)"/>
  <text x="55" y="55" class="title">Lumi Multi-Agent Framework</text>
  <text x="55" y="87" class="subtitle">Mỗi khối là một actor, task, service hoặc store; contract và lifecycle chỉ là nhãn luồng</text>

  <!-- Main Agent -->
  <g filter="url(#shadow)">
    <rect x="50" y="205" width="310" height="230" rx="23" fill="#eef5ff" stroke="#668ab7" stroke-width="2"/>
    <rect x="75" y="228" width="112" height="25" rx="12" fill="#dceaff"/>
    <text x="131" y="246" text-anchor="middle" class="pill" fill="#386ca8">MAIN AGENT</text>
    <text x="205" y="296" text-anchor="middle" class="box-title">Gemini Live</text>
    <text x="205" y="328" text-anchor="middle" class="body">Hội thoại và tool nhanh</text>
    <text x="205" y="356" text-anchor="middle" class="body">Route yêu cầu tạo panel</text>
    <text x="205" y="384" text-anchor="middle" class="body">Nhận trạng thái và tương tác UI</text>
    <text x="205" y="414" text-anchor="middle" class="small">Không tự thiết kế Surface</text>
  </g>

  <!-- Task Manager boundary; orchestration is a responsibility, not a separate object -->
  <rect x="420" y="125" width="650" height="855" rx="28" fill="#f7f5ff" stroke="#9178c6" stroke-width="2"/>
  <rect x="446" y="147" width="170" height="29" rx="14" fill="#e7e0fa"/>
  <text x="531" y="167" text-anchor="middle" class="pill" fill="#674da3">TASK MANAGER</text>
  <text x="640" y="167" class="small">schedule · retry · cancel · pause · barrier</text>

  <g filter="url(#shadow)">
    <rect x="520" y="195" width="450" height="105" rx="19" fill="#f0eaff" stroke="#8b6fc2" stroke-width="1.9"/>
    <text x="745" y="234" text-anchor="middle" class="box-title">Task Manager Agent</text>
    <text x="745" y="263" text-anchor="middle" class="body">Thiết kế Surface và chọn task_type từ Task Catalog</text>
    <text x="745" y="286" text-anchor="middle" class="small">đầu ra: Surface Draft + danh sách task</text>
  </g>

  <path class="flow" d="M360 260 H520"/>
  <text x="440" y="249" text-anchor="middle" class="tiny">request tự nhiên</text>

  <!-- Surface Plan is an arrow payload, not a box -->
  <path class="flow" d="M745 300 V336"/>
  <text x="765" y="321" class="tiny">Surface Plan: task_type · #E · target_slots · instruction</text>

  <!-- Child task collection -->
  <rect x="500" y="336" width="490" height="398" rx="20" fill="#ffffff" stroke="#b9a8dc" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="525" y="363" class="pill" fill="#7358ad">CHILD TASKS</text>

  <g>
    <rect x="535" y="382" width="420" height="70" rx="16" fill="#edf6fb" stroke="#73a4bd" stroke-width="1.7"/>
    <text x="745" y="412" text-anchor="middle" class="box-title">search_information_task</text>
    <text x="745" y="438" text-anchor="middle" class="body">Information Agent tìm và xác minh dữ kiện</text>
  </g>
  <g>
    <rect x="535" y="472" width="420" height="70" rx="16" fill="#eef8f4" stroke="#68a88d" stroke-width="1.7"/>
    <text x="745" y="502" text-anchor="middle" class="box-title">search_image_task</text>
    <text x="745" y="528" text-anchor="middle" class="body">Image Search Agent tìm media phù hợp</text>
  </g>
  <g>
    <rect x="535" y="562" width="420" height="70" rx="16" fill="#fff7e9" stroke="#d4a05e" stroke-width="1.7"/>
    <text x="745" y="592" text-anchor="middle" class="box-title">draw_image_task</text>
    <text x="745" y="618" text-anchor="middle" class="body">Image Draw Agent tạo media mới</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="535" y="652" width="420" height="70" rx="16" fill="#eff9f3" stroke="#48a279" stroke-width="1.9"/>
    <text x="745" y="682" text-anchor="middle" class="box-title">&lt;async_task từ manifest&gt;</text>
    <text x="745" y="708" text-anchor="middle" class="body">Task động gọi Agent Service của developer</text>
  </g>

  <!-- Artifact outputs converge on a bus and then a real Store object -->
  <path d="M470 417 V797" fill="none" stroke="#6e85a0" stroke-width="2.2"/>
  <path class="flow" d="M535 417 H470"/>
  <path class="flow" d="M535 507 H470"/>
  <path class="flow" d="M535 597 H470"/>
  <path class="flow" d="M535 687 H470"/>
  <text x="456" y="610" text-anchor="end" class="tiny">final Artifact theo #E</text>

  <g>
    <rect x="535" y="762" width="420" height="70" rx="16" fill="#f3f0ff" stroke="#8f79c0" stroke-width="1.7"/>
    <text x="745" y="792" text-anchor="middle" class="box-title">Artifact Store</text>
    <text x="745" y="818" text-anchor="middle" class="body">Lưu kết quả cuối của từng task thành công</text>
  </g>
  <path class="flow" d="M470 797 H535"/>

  <g filter="url(#shadow)">
    <rect x="535" y="865" width="420" height="82" rx="17" fill="#fff0f6" stroke="#bd7892" stroke-width="1.9"/>
    <text x="745" y="898" text-anchor="middle" class="box-title">complete_surface_task</text>
    <text x="745" y="926" text-anchor="middle" class="body">Surface Assembly Agent ghép #E → target_slots</text>
  </g>
  <path class="flow" d="M745 832 V865"/>

  <!-- Shared services and output actors -->
  <rect x="1135" y="125" width="445" height="855" rx="28" fill="#f5fbf8" stroke="#71a98f" stroke-width="2"/>
  <rect x="1161" y="147" width="174" height="29" rx="14" fill="#dff2e8"/>
  <text x="1248" y="167" text-anchor="middle" class="pill" fill="#277a59">SHARED SERVICES</text>

  <g filter="url(#shadow)">
    <rect x="1180" y="325" width="355" height="210" rx="20" fill="#eef8f4" stroke="#5da283" stroke-width="1.8"/>
    <text x="1357" y="365" text-anchor="middle" class="box-title">Knowledge Gateway</text>
    <text x="1357" y="398" text-anchor="middle" class="body">Một cổng truy xuất dùng chung</text>
    <text x="1357" y="430" text-anchor="middle" class="body">search_local_text</text>
    <text x="1357" y="458" text-anchor="middle" class="body">search_local_media</text>
    <text x="1357" y="495" text-anchor="middle" class="small">Task tự chọn package từ Knowledge Catalog</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1180" y="615" width="355" height="150" rx="20" fill="#ecf9f2" stroke="#4ea47b" stroke-width="1.8" stroke-dasharray="8 5"/>
    <text x="1357" y="655" text-anchor="middle" class="box-title">External Async Agent Service</text>
    <text x="1357" y="687" text-anchor="middle" class="body">Developer tự quản model · prompt · tools</text>
    <text x="1357" y="715" text-anchor="middle" class="body">submit · status · result · cancel</text>
    <text x="1357" y="744" text-anchor="middle" class="small">Nằm ngoài Framework Core</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1180" y="835" width="355" height="125" rx="20" fill="#fff8ed" stroke="#d49b54" stroke-width="1.8"/>
    <text x="1357" y="875" text-anchor="middle" class="box-title">Browser / Panel</text>
    <text x="1357" y="907" text-anchor="middle" class="body">Render Final Surface, widget và effect</text>
    <text x="1357" y="935" text-anchor="middle" class="small">interaction + render confirmation về Gemini Live</text>
  </g>

  <!-- Task-to-service calls use separate horizontal lanes -->
  <path class="flow" d="M955 417 H1120 V385 H1180"/>
  <text x="1040" y="406" class="tiny">text retrieval</text>
  <path class="flow" d="M955 507 H1135 V465 H1180"/>
  <text x="1038" y="496" class="tiny">media retrieval</text>
  <path class="fallback" d="M955 507 H1030 V597 H955"/>
  <text x="1038" y="558" class="tiny">fallback khi ảnh không usable</text>
  <path class="flow" d="M955 687 H1180"/>
  <text x="1068" y="676" text-anchor="middle" class="tiny">HTTP async protocol</text>
  <path class="flow" d="M955 906 H1180"/>
  <text x="1068" y="895" text-anchor="middle" class="tiny">Final Surface + Stage/ASCII map</text>

  <!-- Browser feedback routes around the object areas -->
  <path class="fallback" d="M1535 900 H1605 V105 H205 V205"/>
  <text x="900" y="98" text-anchor="middle" class="tiny">surface:rendered · panel interaction · completion status</text>

  <!-- Shared Registry Hub -->
  <rect x="50" y="1030" width="1900" height="185" rx="25" fill="#f5f1ff" stroke="#927dc5" stroke-width="2"/>
  <rect x="75" y="1051" width="286" height="29" rx="14" fill="#e4dcfa"/>
  <text x="218" y="1071" text-anchor="middle" class="pill" fill="#664ca3">SHARED REGISTRY &amp; CATALOG HUB</text>
  <text x="385" y="1071" class="small">Registry mô tả khả năng; không phải task thực thi</text>

  <g><rect x="80" y="1102" width="400" height="82" rx="16" fill="#fff" stroke="#9e8bca" stroke-width="1.5"/><text x="280" y="1134" text-anchor="middle" class="box-title">UI Registry</text><text x="280" y="1162" text-anchor="middle" class="body">Widget + Effect contracts/renderers</text></g>
  <g><rect x="520" y="1102" width="400" height="82" rx="16" fill="#fff" stroke="#9e8bca" stroke-width="1.5"/><text x="720" y="1134" text-anchor="middle" class="box-title">Task Registry / Catalog</text><text x="720" y="1162" text-anchor="middle" class="body">task_type công khai + manifest wiring</text></g>
  <g><rect x="960" y="1102" width="460" height="82" rx="16" fill="#fff" stroke="#9e8bca" stroke-width="1.5"/><text x="1190" y="1134" text-anchor="middle" class="box-title">Knowledge Registry</text><text x="1190" y="1162" text-anchor="middle" class="body">Knowledge Catalog + package providers</text></g>
  <g><rect x="1460" y="1102" width="420" height="82" rx="16" fill="#fff" stroke="#9e8bca" stroke-width="1.5"/><text x="1670" y="1134" text-anchor="middle" class="box-title">Resource Catalog</text><text x="1670" y="1162" text-anchor="middle" class="body">Assets + Surface Templates</text></g>

  <path class="catalog" d="M720 1102 V995 H745 V980"/>
  <path class="catalog" d="M1190 1102 V1005 H1595 V430 H1535"/>

  <!-- Developer Extension Points -->
  <rect x="50" y="1250" width="1900" height="175" rx="25" fill="#f1faf5" stroke="#5eac84" stroke-width="2"/>
  <rect x="75" y="1271" width="292" height="29" rx="14" fill="#daf2e5"/>
  <text x="221" y="1291" text-anchor="middle" class="pill" fill="#217a56">DEVELOPER EXTENSION POINTS</text>
  <text x="390" y="1291" class="small">Developer thêm đối tượng/package ở đây; không thêm “khối Runtime” vào sơ đồ</text>

  <g><rect x="80" y="1330" width="400" height="65" rx="15" fill="#fff" stroke="#68b18c" stroke-width="1.5"/><text x="280" y="1357" text-anchor="middle" class="box-title">Widget / Effect Package</text><text x="280" y="1382" text-anchor="middle" class="small">manifest + extension code</text></g>
  <g><rect x="520" y="1330" width="400" height="65" rx="15" fill="#fff" stroke="#68b18c" stroke-width="1.5"/><text x="720" y="1357" text-anchor="middle" class="box-title">Async Task Manifest</text><text x="720" y="1382" text-anchor="middle" class="small">task_type + Agent Service URL + schemas</text></g>
  <g><rect x="960" y="1330" width="460" height="65" rx="15" fill="#fff" stroke="#68b18c" stroke-width="1.5"/><text x="1190" y="1357" text-anchor="middle" class="box-title">Knowledge Package</text><text x="1190" y="1382" text-anchor="middle" class="small">manifest + provider + schema/storage</text></g>
  <g><rect x="1460" y="1330" width="420" height="65" rx="15" fill="#fff" stroke="#68b18c" stroke-width="1.5"/><text x="1670" y="1357" text-anchor="middle" class="box-title">Assets / Templates</text><text x="1670" y="1382" text-anchor="middle" class="small">resource + catalog metadata</text></g>

  <path class="register" d="M280 1330 V1184"/><path class="register" d="M720 1330 V1184"/><path class="register" d="M1190 1330 V1184"/><path class="register" d="M1670 1330 V1184"/>

  <!-- Legend -->
  <g transform="translate(1130,52)">
    <line x1="0" y1="0" x2="42" y2="0" stroke="#3b70ad" stroke-width="2.6"/><text x="50" y="5" class="tiny">request/result flow</text>
    <line x1="200" y1="0" x2="242" y2="0" stroke="#7759b3" stroke-width="2.3" stroke-dasharray="8 6"/><text x="250" y="5" class="tiny">catalog access</text>
    <line x1="390" y1="0" x2="432" y2="0" stroke="#269369" stroke-width="2.6"/><text x="440" y="5" class="tiny">register extension</text>
    <line x1="615" y1="0" x2="657" y2="0" stroke="#d77b31" stroke-width="2.3" stroke-dasharray="8 6"/><text x="665" y="5" class="tiny">fallback/feedback</text>
  </g>
</svg>
